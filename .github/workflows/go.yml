name: Go

on:
  push:
    branches: [ "ver/1.21.1" ]
  pull_request:
    branches: [ "ver/1.21.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Build
        run: go build -v ./...
        working-directory: recipe-generator

      - name: Test
        run: go test -v ./...
        working-directory: recipe-generator
